services:

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - app-network


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app-network


  host-webapi:
    build:
      context: ${WEBAPI_PATH}
      dockerfile: ${WEBAPI_DOCKERFILE}

    container_name: host-webapi
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PostgreConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"

      # s3 secrets
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__BucketName: ${S3_BUCKET_NAME}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__ExpirationMinutes: ${Jwt__ExpirationMinutes}
      

    ports:
      - "${WEBAPI_PORT}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app-network


  frontend:
    build:
      context: ./AstroFrontend
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_BASE_URL=$PUBLIC_API_BASE_URL
      
    container_name: frontend
    restart: unless-stopped

    environment:
      NODE_ENV: ${NODE_ENV}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}

    ports:
      - "${FRONTEND_PORT}:4321"

    depends_on:
      - host-webapi

    networks:
      - app-network


networks:
  app-network:
    driver: bridge